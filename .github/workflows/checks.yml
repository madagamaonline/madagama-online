name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://offline:offline@127.0.0.1:1/offline
      DIRECT_URL: postgresql://offline:offline@127.0.0.1:1/offline
      TEST_DATABASE_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: ./node_modules/.bin/tsc --noEmit --incremental false
      - run: ./node_modules/.bin/prisma validate
